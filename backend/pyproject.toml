[project]
name = "meridian-backend"
version = "0.1.0"
description = "Meridian Airport PMO suite — backend (FastAPI). Proprietary software of GV Softwares."
requires-python = ">=3.11"
authors = [{ name = "Gaurav Vatsa", email = "gaurav1976@gmail.com" }]
maintainers = [{ name = "Gaurav Vatsa", email = "gaurav1976@gmail.com" }]
license = { text = "Proprietary — (c) GV Softwares. All rights reserved." }
keywords = ["meridian", "airport", "pmo", "programme-management", "gv-softwares"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "email-validator>=2.1",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.9",
    "httpx>=0.27",
    "redis>=5.0",
    "rq>=1.16",
    "reportlab>=4.2",
    "openpyxl>=3.1",
    "pypdf>=4.3",
    "python-docx>=1.1",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "fakeredis>=2.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
